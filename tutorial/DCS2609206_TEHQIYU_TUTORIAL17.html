<!DOCTYPE html> 
<html>
<head>
<title>Table</title>

<link rel=icon href=images.jpg type=image/jpg>
<meta name=viewport content=width=device-width,initial-scale=1.0>
<script>
 function showmessage() {
    alert("This is row1 col1");
    }
 function bigImg(x){
    x.style.height="300px";
    x.style.width="440px";
}
function normalImg(x){
    x.style.height="50%";
    x.style.width="50%";
}

</script>
</head>
<body topmargin=20 leftmargin=50>
 
<table border=3 width=50% and height=50% align=center bgcolor=silver>
<caption>My First Web Table<br><br></caption>
<tr>
<th>header one</th>
<th>header two</th>
<th>header three</th>
<th>header four</th>
</tr>

<tr>
<td><button onclick="showmessage()" >row1-col1</button></td>
<td onmouseover="bigImg(this)" onmouseout="normalImg(this)">data row1-col2</td>
<td ondblclick="bigImg(this)" onmouseout="normalImg(this)">data row1-col3</td>
<td id = "paraEffect" style="border-style: double; color:red; width:fit-content;">data row1-col4</td>
</tr>

<tr>
<td>data row2-col1</td>
<td>data row2-col2</td>
<td>data row2-col3</td>
<td>data row2-col4</td>
</tr>

<tr>
<td>data row3-col1</td>
<td>data row3-col2</td>
<td>data row3-col3</td>
<td>data row3-col4</td>
</tr>
</table>
<script>
document.getElementById("paraEffect").onclick = function() {
  changeEffect()    
  };
  function changeEffect()    {
    document.getElementById("paraEffect").innerHTML = "Welcome to my website!";
    document.getElementById("paraEffect").style.color = "#C71585";
    document.getElementById("paraEffect").style.backgroundColor = "#B0E0E6";
    document.getElementById("paraEffect").style.fontSize = "25px";
    document.getElementById("paraEffect").style.border = "4px groove red"; 
    document.getElementById("paraEffect").style.fontWeight = "bold"; 
    document.getElementById("paraEffect").style.boxShadow = "Black"; 
  }
</script>

</body></html>
