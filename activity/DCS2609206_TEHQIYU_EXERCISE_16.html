<!DOCTYPE html>
<html>
<head><title>Form - Text Input</title>
<link rel="icon" href="3881.jpg" type="image/jpg">
<link rel="stylesheet" href="activity8c.css">
<script>
    function validateForm() {
       // to validate text - do not allow empty
       let x = document.MyFirstForm.fname.value;
       if (x == "") {
              alert("Please provide your first name");
              return false;
         }
        // to validate text - only allow alphabet characters
        let y = document.MyFirstForm.lname.value;
        var letters = /^[A-Za-z]+$/;
        if(!y.match(letters)) {
            alert("Please input alphabet characters for Last Name");
            return false;
        }
        if (( MyFirstForm.gender[0].checked == false ) && ( MyFirstForm.gender[1].checked == false )) {
            alert("Please Choose Gender: Male or Female");
            return false;
        }
        if (( MyFirstForm.fav_sub[0].checked == false ) && ( MyFirstForm.fav_sub[1].checked == false ) && ( MyFirstForm.fav_sub[2].checked == false )&& ( MyFirstForm.fav_sub[3].checked == false )) {
            alert("No checkbos is checked");
            return false;
        }
    }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin-top: 50px;">
<center>
<form name="MyFirstForm" onsubmit="return validateForm()">
<div style="background-color: powderblue;
color:#696969;
font-family:verdana;
font-size: 60%;
text-align: center;
width: 60%;
height: 40%;">
<table style="margin: 100; text-align: left;">
<th colspan="2" style="text-align: center; font-size: 120%;">
Personal Details
</th>
<tr>
<td>First Name:</td>
<td><input = type=text name =fname value='Name'size=50 maxlength=10></td>
</tr>
<tr>
<td>Last Name:</td>
<td><input type="text" name="lname" placeholder="Last name" maxlength="10"></td>


</tr>
<tr>
<td>Gender:</td>
<td>
<input type="radio" name="gender" value="Male">Male
<input type="radio" name="gender" value="Female">Female
</td>
</tr>
<tr>
<td>Choose your favourite subject:</td>
<td>
<input type="checkbox" name="fav_sub" value="DCS4103" checked>DCS4103
<input type="checkbox" name="fav_sub" value="DCS3003" disabled>DCS3003
<input type="checkbox" name="fav_sub" value="MST1003">MST1003
<input type="checkbox" name="fav_sub" value="MST2003">MST2003
</td>
</tr>
<tr>
<td>Address:</td>
<td><textarea rows="4" cols="30" name="address"></textarea></td>
</tr>
<tr>
<td>Date of Birth:</td>
<td><input type="date" name="dob" min="2000-01-01" max="2005-12-31"></td>
</tr>
<tr>
<td>Login password:</td>
<td><input type="password" name="loginpass" readonly></td>
</tr>
<tr>
<td class="title">
Course:
</td>
<td>
<select name="course">
<option value="0">- List of Courses</option>

<optgroup label="Diploma In Computer Science">
<option value="DCS_S1">Semester 1</option>
<option value="DCS_S2">Semester 2</option>
<option value="DCS_S3">Semester 3</option>
<option value="DCS_S4">Semester 4</option>
<option value="DCS_S5">Semester 5</option>
<option value="DCS_S6">Semester 6</option>
</optgroup>

<option value="DIB">Diploma in Business</option>
<option value="DAS">Diploma in Airline Services</option>
</select>
</td>
</tr>
</table>
<br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
<br><br>
</div
</form>
</center>
</body></html>
